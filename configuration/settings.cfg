; Syntax of this configuration file:
; 
; [key]: setting key
; - Field "description": description, just for information.
; - Field "type": type of setting, e. g. mail, number, foreign_key, etc.
; - Field "default": default value
;

[mod_work_install_date]
description = "Initial installation date of work module (for updates)"
type = datetime

[work_projects]
description = "Link tasks and worklogs to projects (requires events module)"
type = bool
modules[] = events

[work_tasks_important]
description = "Task tag categories for the “Important” block on tasks today"
type = bool
scope[] = categories
subtree[] = tags
subtree[] = tasks

[work_worklog_ics_default_duration_minutes]
description = "Default length in minutes for a work log iCal entry when end time is missing"
type = int
default = 60

[work_worklog_ics_secret_key]
description = "Secret key used to sign work log iCal subscription URLs (access without login)"
type = random
private = 1

[work_worklog_ics_secret_key_validity_in_minutes]
description = "Timeframe in minutes during which each work log iCal subscription link stays valid"
type = int
default = 10800
